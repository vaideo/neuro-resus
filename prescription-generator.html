<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Prescription Generator</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Prescription">
<style>
  :root{
    --ink:#1a2b3c;
    --muted:#5c6b7a;
    --line:#c9d2da;
    --accent:#2563eb;
    --bg:#f3f5f7;
    --panel:#ffffff;
    --rx-letterhead-space:38mm; /* blank space reserved for pre-printed letterhead header */
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Segoe UI",Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:var(--ink);
    padding-bottom:84px; /* room for sticky action bar */
  }
  header.app-title{
    padding:16px 16px 14px;
    background:var(--panel);
    border-bottom:1px solid var(--line);
    position:sticky;
    top:0;
    z-index:5;
  }
  header.app-title h1{
    margin:0;
    font-size:18px;
  }
  header.app-title p{
    margin:4px 0 0;
    color:var(--muted);
    font-size:12px;
  }

  .tabs{
    display:flex;
    background:var(--panel);
    border-bottom:1px solid var(--line);
    position:sticky;
    top:57px;
    z-index:5;
  }
  .tabs button{
    flex:1;
    padding:11px 8px;
    border:none;
    background:none;
    font-size:13px;
    font-weight:600;
    color:var(--muted);
    border-bottom:3px solid transparent;
  }
  .tabs button.active{
    color:var(--accent);
    border-bottom-color:var(--accent);
  }

  .view{display:none;padding:14px;}
  .view.active{display:block;}

  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:8px;
    padding:16px;
  }
  .panel + .panel{margin-top:14px;}
  .panel h2{
    margin:0 0 12px;
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:.04em;
    color:var(--muted);
  }
  .field{margin-bottom:14px;}
  .field:last-child{margin-bottom:0;}
  .field label{
    display:block;
    font-size:13px;
    font-weight:600;
    margin-bottom:5px;
  }
  .field input,
  .field textarea,
  .field select{
    width:100%;
    padding:11px 12px;
    border:1px solid var(--line);
    border-radius:6px;
    font-family:inherit;
    font-size:16px; /* prevents iOS zoom-on-focus */
    background:#fff;
    color:var(--ink);
  }
  .field textarea{
    resize:vertical;
    min-height:64px;
  }
  .row-2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }

  .action-bar{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    display:flex;
    gap:10px;
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    background:var(--panel);
    border-top:1px solid var(--line);
    z-index:10;
  }
  button.btn{
    cursor:pointer;
    border:none;
    border-radius:8px;
    padding:13px 16px;
    font-size:15px;
    font-weight:700;
  }
  #print-btn{
    background:var(--accent);
    color:#fff;
    flex:2;
  }
  #clear-btn{
    background:#eef0f2;
    color:var(--ink);
    flex:1;
  }

  /* Prescription sheet */
  #rx-sheet{
    background:#fff;
    border:1px solid var(--line);
    border-radius:6px;
    padding:18px 16px;
  }
  .patient-strip{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px 14px;
    background:#f7f9fb;
    border:1px solid var(--line);
    border-radius:6px;
    padding:10px 12px;
    margin-bottom:16px;
    font-size:13px;
  }
  .patient-strip div span.k{
    display:block;
    color:var(--muted);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.03em;
  }
  .patient-strip div span.v{
    font-weight:600;
    word-break:break-word;
  }
  .rx-section{margin-bottom:14px;}
  .rx-section h3{
    margin:0 0 5px;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.04em;
    color:var(--accent);
    border-bottom:1px solid var(--line);
    padding-bottom:4px;
  }
  .rx-section .content{
    font-size:14px;
    white-space:pre-wrap;
    line-height:1.5;
  }
  .rx-section.empty .content{color:#aab2ba;font-style:italic;}
  .rx-treatment .content::before{
    content:"℞ ";
    font-weight:700;
    font-size:17px;
    color:var(--accent);
  }
  .rx-footer{
    margin-top:30px;
    border-top:1px solid var(--line);
    padding-top:10px;
    font-size:11px;
    color:var(--muted);
  }
  .rx-footer .sign-box{
    border-top:1px solid var(--ink);
    width:160px;
    margin:0 0 4px auto;
  }
  .rx-footer .sign-line{text-align:right;}

  @media print{
    body{padding-bottom:0;}
    body *{visibility:hidden;}
    #rx-sheet, #rx-sheet *{visibility:visible;}
    #rx-sheet{
      position:absolute;
      top:0;
      left:0;
      width:100%;
      border:none;
      padding:var(--rx-letterhead-space) 8mm 8mm;
    }
    header.app-title, .tabs, .action-bar{display:none !important;}
  }

  @media (min-width:760px){
    body{padding-bottom:0;}
    .tabs{display:none;}
    .layout{
      display:flex;
      gap:20px;
      padding:20px;
      max-width:1300px;
      margin:0 auto;
      align-items:flex-start;
    }
    .view{display:block !important;padding:0;}
    #form-view{flex:1 1 380px;max-width:420px;}
    #preview-view{flex:2 1 600px;}
    .action-bar{
      position:static;
      border-top:none;
      padding:16px 0 0;
      max-width:420px;
      margin:0 auto;
    }
  }
</style>
</head>
<body>

<header class="app-title">
  <h1>Prescription Generator</h1>
  <p>Enter patient details, preview, and print.</p>
</header>

<nav class="tabs">
  <button id="tab-form-btn" class="active">Edit</button>
  <button id="tab-preview-btn">Preview</button>
</nav>

<div class="layout">
<div id="form-view" class="view active">
  <div class="panel">
    <h2>Patient Details</h2>
    <div class="row-2">
      <div class="field">
        <label for="patientId">Patient ID</label>
        <input type="text" id="patientId" placeholder="e.g. PT-00123">
      </div>
      <div class="field">
        <label for="date">Date</label>
        <input type="date" id="date">
      </div>
    </div>
    <div class="row-2">
      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Patient full name">
      </div>
      <div class="field">
        <label for="age">Age</label>
        <input type="text" id="age" placeholder="e.g. 45 yrs">
      </div>
    </div>
    <div class="field">
      <label for="gender">Gender</label>
      <select id="gender">
        <option value="">Select</option>
        <option>Male</option>
        <option>Female</option>
        <option>Other</option>
      </select>
    </div>
  </div>

  <div class="panel">
    <h2>Clinical Notes</h2>
    <div class="field">
      <label for="history">History</label>
      <textarea id="history" placeholder="Presenting complaints, past history, etc."></textarea>
    </div>
    <div class="field">
      <label for="examination">Examination</label>
      <textarea id="examination" placeholder="Vitals, general and systemic examination findings"></textarea>
    </div>
    <div class="field">
      <label for="diagnosis">Diagnosis</label>
      <textarea id="diagnosis" placeholder="Provisional / final diagnosis"></textarea>
    </div>
    <div class="field">
      <label for="investigations">Investigations</label>
      <textarea id="investigations" placeholder="Labs, imaging, tests advised"></textarea>
    </div>
    <div class="field">
      <label for="treatment">Treatment</label>
      <textarea id="treatment" placeholder="Medicines, dosage, frequency, duration"></textarea>
    </div>
    <div class="field">
      <label for="advice">Advice</label>
      <textarea id="advice" placeholder="Lifestyle advice, follow-up date, warnings"></textarea>
    </div>
  </div>
</div>

<div id="preview-view" class="view">
  <div id="rx-sheet">
    <div class="patient-strip">
      <div><span class="k">Patient ID</span><span class="v" id="out-patientId">-</span></div>
      <div><span class="k">Date</span><span class="v" id="out-date">-</span></div>
      <div><span class="k">Name</span><span class="v" id="out-name">-</span></div>
      <div><span class="k">Age</span><span class="v" id="out-age">-</span></div>
      <div><span class="k">Gender</span><span class="v" id="out-gender">-</span></div>
    </div>

    <div class="rx-section empty" id="sec-history">
      <h3>History</h3>
      <div class="content" id="out-history">-</div>
    </div>
    <div class="rx-section empty" id="sec-examination">
      <h3>Examination</h3>
      <div class="content" id="out-examination">-</div>
    </div>
    <div class="rx-section empty" id="sec-diagnosis">
      <h3>Diagnosis</h3>
      <div class="content" id="out-diagnosis">-</div>
    </div>
    <div class="rx-section empty" id="sec-investigations">
      <h3>Investigations</h3>
      <div class="content" id="out-investigations">-</div>
    </div>
    <div class="rx-section rx-treatment empty" id="sec-treatment">
      <h3>Treatment</h3>
      <div class="content" id="out-treatment">-</div>
    </div>
    <div class="rx-section empty" id="sec-advice">
      <h3>Advice</h3>
      <div class="content" id="out-advice">-</div>
    </div>

    <div class="rx-footer">
      <div class="sign-line">
        <div class="sign-box"></div>
        Signature
      </div>
    </div>
  </div>
</div>

<div class="action-bar">
  <button id="print-btn" class="btn" type="button">Print Prescription</button>
  <button id="clear-btn" class="btn" type="button">Clear</button>
</div>
</div>

<script>
(function(){
  var textFields = ["patientId","name","age","gender"];
  var noteFields = ["history","examination","diagnosis","investigations","treatment","advice"];
  var docTitle = document.title;

  var dateInput = document.getElementById("date");
  var today = new Date();
  dateInput.value = today.toISOString().slice(0,10);

  function formatDate(value){
    if(!value) return "-";
    var parts = value.split("-");
    if(parts.length !== 3) return value;
    var d = new Date(parts[0], parts[1]-1, parts[2]);
    var opts = { day:"2-digit", month:"short", year:"numeric" };
    return d.toLocaleDateString("en-GB", opts);
  }

  function sanitizeForFilename(value){
    return value.trim().replace(/[^a-zA-Z0-9-_]+/g, "_").replace(/^_+|_+$/g, "");
  }

  function updatePreview(){
    document.getElementById("out-patientId").textContent =
      document.getElementById("patientId").value.trim() || "-";

    document.getElementById("out-date").textContent = formatDate(dateInput.value);
    document.getElementById("out-name").textContent =
      document.getElementById("name").value.trim() || "-";
    document.getElementById("out-age").textContent =
      document.getElementById("age").value.trim() || "-";
    document.getElementById("out-gender").textContent =
      document.getElementById("gender").value || "-";

    noteFields.forEach(function(id){
      var val = document.getElementById(id).value.trim();
      var out = document.getElementById("out-" + id);
      var section = document.getElementById("sec-" + id);
      out.textContent = val || "-";
      if(val){
        section.classList.remove("empty");
      } else {
        section.classList.add("empty");
      }
    });
  }

  var allInputs = document.querySelectorAll("#form-view input, #form-view textarea, #form-view select");
  allInputs.forEach(function(el){
    el.addEventListener("input", updatePreview);
    el.addEventListener("change", updatePreview);
  });

  // Mobile tab switching (Edit / Preview)
  var tabFormBtn = document.getElementById("tab-form-btn");
  var tabPreviewBtn = document.getElementById("tab-preview-btn");
  var formView = document.getElementById("form-view");
  var previewView = document.getElementById("preview-view");

  function showView(name){
    var isForm = name === "form";
    formView.classList.toggle("active", isForm);
    previewView.classList.toggle("active", !isForm);
    tabFormBtn.classList.toggle("active", isForm);
    tabPreviewBtn.classList.toggle("active", !isForm);
  }
  tabFormBtn.addEventListener("click", function(){ showView("form"); });
  tabPreviewBtn.addEventListener("click", function(){ showView("preview"); });

  function restoreTitle(){
    document.title = docTitle;
    window.removeEventListener("afterprint", restoreTitle);
  }

  document.getElementById("print-btn").addEventListener("click", function(){
    showView("preview");
    var pid = sanitizeForFilename(document.getElementById("patientId").value || "");
    document.title = pid ? ("Prescription_" + pid) : "Prescription";
    window.addEventListener("afterprint", restoreTitle);
    window.print();
    setTimeout(restoreTitle, 3000); // fallback for browsers that skip afterprint
  });

  document.getElementById("clear-btn").addEventListener("click", function(){
    if(!confirm("Clear all fields?")) return;
    textFields.concat(noteFields).forEach(function(id){
      var el = document.getElementById(id);
      if(el) el.value = "";
    });
    dateInput.value = today.toISOString().slice(0,10);
    updatePreview();
  });

  updatePreview();
})();
</script>

</body>
</html>
